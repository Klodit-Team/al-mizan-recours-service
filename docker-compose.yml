services:
  # ── Application NestJS ──────────────────────────────
  recours-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: al_mizan_recours
    ports:
      - "8008:8008"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 8008
      RECOURS_DELAI_REPONSE_JOURS: 10
      DATABASE_URL: postgresql://${POSTGRES_USER:-recours_user}:${POSTGRES_PASSWORD:-recours_password}@postgres:5432/${POSTGRES_DB:-recours_db}
      REDIS_HOST: al-mizan-redis
      REDIS_PORT: 6379
      REDIS_CACHE_TTL: 300
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run start:dev
    networks:
      - al-mizan-network
    restart: unless-stopped

  # ── PostgreSQL ───────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: al_mizan_recours_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recours_db}
      POSTGRES_USER: ${POSTGRES_USER:-recours_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recours_password}
      PGDATA: /data/postgres
    ports:
      - "5436:5432"
    volumes:
      - recours_pg_data:/data/postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recours_user} -d ${POSTGRES_DB:-recours_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - al-mizan-network

volumes:
  recours_pg_data:

networks:
  al-mizan-network:
    name: al-mizan-network
    external: true