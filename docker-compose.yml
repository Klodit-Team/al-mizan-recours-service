services:
  # ── Application NestJS ──────────────────────────────
  recours-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: al_mizan_recours
    ports:
      - "8008:8008"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 8008
      RECOURS_DELAI_REPONSE_JOURS: 10
      DATABASE_URL: postgresql://${POSTGRES_USER:-recours_user}:${POSTGRES_PASSWORD:-recours_password}@postgres:5432/${POSTGRES_DB:-recours_db}
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: npm run start:dev
    networks:
      - al_mizan_network
    restart: unless-stopped

  # ── PostgreSQL ───────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: al_mizan_recours_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recours_db}
      POSTGRES_USER: ${POSTGRES_USER:-recours_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recours_password}
      PGDATA: /data/postgres
    ports:
      - "5436:5432"
    volumes:
      - recours_pg_data:/data/postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recours_user} -d ${POSTGRES_DB:-recours_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - al_mizan_network

  # ── RabbitMQ ─────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: al_mizan_rabbitmq_recours_dev
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - al_mizan_network

  # ── pgAdmin ──────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: al_mizan_pgadmin_recours
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@almizan.dz}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - al_mizan_network
    profiles:
      - tools

volumes:
  recours_pg_data:

networks:
  al_mizan_network:
    driver: bridge
    name: al_mizan_network
    external: false